<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>定制桌宠</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="wrap">
    <canvas id="fx"></canvas>
    <img id="pet" alt="">
  </div>
  <div id="tray" class="hidden">
    <div class="tray-head">互动托盘</div>
    <div class="tray-grid">
      <button class="tray-btn" data-act="feed"><b>🍪</b><i>喂食</i></button>
      <button class="tray-btn" data-act="say"><b>💬</b><i>说话</i></button>
      <button class="tray-btn" data-act="chute"><b>🪂</b><i>开伞</i></button>
      <button class="tray-btn" data-act="sleep"><b>😴</b><i>哄睡</i></button>
      <button class="tray-btn" data-act="char"><b>🎭</b><i>换角色</i></button>
      <button class="tray-btn" data-act="edge"><b>📌</b><i>贴边</i></button>
      <button class="tray-btn" data-act="scale"><b>🔍</b><i>缩小</i></button>
      <button class="tray-btn" data-act="ghost"><b>👻</b><i>藏起来</i></button>
      <button class="tray-btn" data-act="update"><b>🔄</b><i>查更新</i></button>
    </div>
  </div>
  <div id="picker" class="hidden">
    <div id="pickerCap">选择角色</div>
    <div id="pickerList"></div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
