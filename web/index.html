<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>定制桌宠</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="wrap">
    <canvas id="fx"></canvas>
    <img id="pet" alt="">
  </div>
  <div id="tray" class="hidden">
    <div class="tray-head">互动</div>
    <div class="tray-grid">
      <button class="tray-btn" data-act="feed">喂食</button>
      <button class="tray-btn" data-act="say">说话</button>
      <button class="tray-btn" data-act="chute">开伞</button>
      <button class="tray-btn" data-act="sleep">哄睡</button>
      <button class="tray-btn" data-act="char">换人</button>
      <button class="tray-btn" data-act="edge">贴边</button>
      <button class="tray-btn" data-act="scale">变小</button>
      <button class="tray-btn" data-act="ghost">隐身</button>
      <button class="tray-btn" data-act="update">更新</button>
      <button class="tray-btn" data-act="pat">摸摸</button>
      <button class="tray-btn" data-act="doodle">涂鸦</button>
      <button class="tray-btn" data-act="family">合影</button>
      <button class="tray-btn" data-act="dress">换装</button>
      <button class="tray-btn" data-act="game">接球</button>
    </div>
  </div>
  <div id="picker" class="hidden">
    <div id="pickerCap">选择角色</div>
    <div id="pickerList"></div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
